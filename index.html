<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="weather-container">

        <!-- Header -->
        <div class="header">
            <h1>🌤️ Weather App</h1>

            <button id="darkModeBtn" title="Toggle dark mode">
                🌙
            </button>
        </div>

        <!-- Search -->
        <div class="search-box">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
            >

            <button id="searchBtn">
                Search
            </button>

        </div>

        <!-- Location Button -->
        <button id="locationBtn" class="location-btn">
            📍 Use My Location
        </button>

        <!-- Loading -->
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Fetching weather...</p>
        </div>

        <!-- Error -->
        <div id="errorMessage" class="error-message"></div>

        <!-- Current Weather -->
        <div id="weatherInfo" class="weather-info">

            <h2 id="cityName">City Name</h2>

            <img
                id="weatherIcon"
                class="weather-icon"
                src=""
                alt="Weather Icon"
            >

            <h3 id="temperature">--°C</h3>

            <p id="description">
                Weather condition
            </p>

            <!-- Weather Details -->
            <div class="weather-details">

                <div class="detail-card">
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong id="humidity">--%</strong>
                </div>

                <div class="detail-card">
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <strong id="windSpeed">-- m/s</strong>
                </div>

                <div class="detail-card">
                    <span>🌡️</span>
                    <p>Feels Like</p>
                    <strong id="feelsLike">--°C</strong>
                </div>

            </div>

            <!-- Refresh -->
            <button id="refreshBtn" class="refresh-btn">
                🔄 Refresh Weather
            </button>

        </div>

        <!-- 5 Day Forecast -->
        <div class="forecast-section">

            <h2>5-Day Forecast</h2>

            <div id="forecast" class="forecast-container">

                <!-- Forecast cards will be added using JavaScript -->

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
